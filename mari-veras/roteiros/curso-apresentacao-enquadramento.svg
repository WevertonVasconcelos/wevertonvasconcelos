<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="560" fill="#F7F4F0"/>

  <!-- ===== Painel 1: enquadramento 16:9 ===== -->
  <text x="40" y="44" font-family="Georgia, serif" font-weight="bold" font-size="22" fill="#4A3A30">1 · O que aparece na tela (16:9)</text>
  <g transform="translate(40,64)">
    <rect width="640" height="360" fill="#FBF9F6" stroke="#7A5B45" stroke-width="2"/>
    <!-- terços -->
    <g stroke="#D6C3B0" stroke-width="1.5" stroke-dasharray="6 6">
      <line x1="213" y1="0" x2="213" y2="360"/>
      <line x1="427" y1="0" x2="427" y2="360"/>
      <line x1="0" y1="120" x2="640" y2="120"/>
      <line x1="0" y1="240" x2="640" y2="240"/>
    </g>
    <!-- silhueta: plano médio, no terço esquerdo -->
    <g fill="#E8D9CB" stroke="#9A7559" stroke-width="2">
      <path d="M95 360 C95 275 125 228 213 222 C301 228 331 275 331 360 Z"/>
      <ellipse cx="213" cy="140" rx="50" ry="62"/>
    </g>
    <!-- olhos na linha do terço -->
    <line x1="188" y1="122" x2="200" y2="122" stroke="#4A3A30" stroke-width="3"/>
    <line x1="226" y1="122" x2="238" y2="122" stroke="#4A3A30" stroke-width="3"/>
    <!-- mãos -->
    <circle cx="160" cy="300" r="15" fill="#E8D9CB" stroke="#9A7559" stroke-width="2"/>
    <circle cx="266" cy="300" r="15" fill="#E8D9CB" stroke="#9A7559" stroke-width="2"/>
    <!-- espaço acima da cabeça -->
    <line x1="290" y1="8" x2="290" y2="74" stroke="#9A7559" stroke-width="1.5"/>
    <text x="298" y="46" font-size="13" fill="#716359">um palmo acima da cabeça</text>
    <!-- cartela à direita -->
    <rect x="450" y="70" width="170" height="150" rx="10" fill="#FBF9F6" stroke="#D6C3B0" stroke-width="2"/>
    <text x="466" y="98" font-size="12" font-weight="bold" letter-spacing="1.5" fill="#9A7559">MÓDULOS · BÔNUS</text>
    <text x="466" y="128" font-family="Georgia, serif" font-size="15" fill="#4A3A30">1 · Cicatrização</text>
    <text x="466" y="154" font-family="Georgia, serif" font-size="15" fill="#4A3A30">2 · Tipos de borda</text>
    <text x="466" y="186" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#C8652A">Bônus: 1º passo</text>
    <text x="466" y="208" font-size="11" fill="#716359">(blocos 4 e 5)</text>
    <!-- cartela de nome -->
    <rect x="16" y="296" width="350" height="50" fill="#4A3A30" fill-opacity="0.88"/>
    <text x="30" y="318" font-family="Georgia, serif" font-weight="bold" font-size="17" fill="#F7F4F0">Mari Véras</text>
    <text x="30" y="337" font-size="10" letter-spacing="1.5" fill="#E8D9CB">ENFERMEIRA DERMATOLÓGICA · COREN-PE 528.268</text>
  </g>
  <g font-size="14" fill="#4A3A30">
    <text x="40" y="452">• Mari no <tspan font-weight="bold">terço esquerdo</tspan>, olhos na linha de cima.</text>
    <text x="40" y="476">• Plano médio: do meio da barriga para cima. As mãos aparecem.</text>
    <text x="40" y="500">• Lado direito livre para as cartelas. Nome no canto inferior.</text>
    <text x="40" y="524">• Olhar na <tspan font-weight="bold">lente</tspan>. Nada entre ela e a câmera.</text>
  </g>

  <!-- ===== Painel 2: montagem vista de cima ===== -->
  <text x="730" y="44" font-family="Georgia, serif" font-weight="bold" font-size="22" fill="#4A3A30">2 · Montagem vista de cima</text>
  <g transform="translate(730,64)">
    <rect width="430" height="360" fill="#FBF9F6" stroke="#7A5B45" stroke-width="2"/>
    <!-- parede de fundo -->
    <rect x="0" y="0" width="430" height="34" fill="#E8D9CB"/>
    <text x="215" y="22" text-anchor="middle" font-size="13" fill="#4A3A30">parede ou cortina clara + 2–3 objetos</text>
    <!-- janela -->
    <rect x="80" y="344" width="270" height="16" fill="#F6DCC8" stroke="#9A7559" stroke-width="2"/>
    <text x="360" y="336" font-size="13" font-weight="bold" fill="#9A7559">JANELA</text><text x="360" y="320" font-size="11" fill="#716359">luz de dia</text>
    <!-- raios de luz -->
    <g stroke="#F6DCC8" stroke-width="3">
      <line x1="150" y1="340" x2="190" y2="160"/>
      <line x1="215" y1="340" x2="215" y2="295"/>
      <line x1="280" y1="340" x2="240" y2="160"/>
    </g>
    <!-- Mari -->
    <circle cx="215" cy="120" r="26" fill="#E8D9CB" stroke="#9A7559" stroke-width="2"/>
    <text x="215" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A3A30">Mari</text>
    <text x="250" y="150" font-size="12" fill="#716359">sentada, lapela</text>
    <!-- distância ao fundo -->
    <line x1="120" y1="36" x2="120" y2="92" stroke="#9A7559" stroke-width="1.5"/>
    <text x="20" y="70" font-size="12" fill="#716359">1,5–2 m</text>
    <!-- câmera -->
    <rect x="195" y="262" width="40" height="26" rx="4" fill="#7A5B45"/>
    <circle cx="215" cy="262" r="6" fill="#F7F4F0"/>
    <text x="246" y="281" font-size="12" fill="#4A3A30">tripé, altura dos olhos</text>
    <!-- distância câmera -->
    <line x1="170" y1="150" x2="170" y2="258" stroke="#9A7559" stroke-width="1.5"/>
    <text x="78" y="210" font-size="12" fill="#716359">1,2–1,5 m</text>
    <!-- abajur -->
    <circle cx="395" cy="62" r="12" fill="none" stroke="#C8652A" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="420" y="90" text-anchor="end" font-size="11" fill="#716359">abajur: desligado</text>
    <text x="420" y="104" text-anchor="end" font-size="11" fill="#716359">ou só no fundo</text>
    <!-- notebook proibido -->
    <g transform="translate(300,190)">
      <rect width="46" height="28" rx="3" fill="none" stroke="#716359" stroke-width="2"/>
      <line x1="-4" y1="-4" x2="50" y2="32" stroke="#C8652A" stroke-width="3"/>
      <text x="-10" y="48" font-size="11" fill="#716359">sem notebook na frente</text>
    </g>
  </g>
  <g font-size="14" fill="#4A3A30">
    <text x="730" y="452">• Gravar de dia, janela de frente para ela.</text>
    <text x="730" y="476">• Celular na horizontal, câmera traseira, 1080p/4K.</text>
    <text x="730" y="500">• Roupa creme, off-white ou mostarda + dourado.</text>
    <text x="730" y="524">• Teste de 30 s com fone antes de gravar.</text>
  </g>
</svg>
